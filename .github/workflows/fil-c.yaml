name: Fil-C

on:
  push:
    paths:
      - ".github/workflows/fil-c.yaml"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "examples/**"
      - "libs/**"
      - "src/libAtomVM/**"
      - "src/platforms/generic_unix/**"
      - "tests/**"
      - "version.cmake"
  pull_request:
    paths:
      - ".github/workflows/fil-c.yaml"
      - "CMakeLists.txt"
      - "CMakeModules/**"
      - "examples/**"
      - "libs/**"
      - "src/libAtomVM/**"
      - "src/platforms/generic_unix/**"
      - "tests/**"
      - "version.cmake"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FIL_C_VERSION: "0.681"
  FIL_C_SHA256: "84272acf017fe76bddb32bb3865f3d97ce332eb6e6a17fc1c07a8eb9ad777787"

jobs:
  build-and-test:
    name: Build and test with Fil-C
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          rebar3-version: "3.25.1"
          gleam-version: "1.15.2"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://repo.hex.pm
            https://cdn.jsdelivr.net/hex

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf ninja-build patchelf xz-utils

      # Fil-C's peak compiler usage appears to exhaust 16 GiB of physical RAM.
      - name: Add swap space
        run: |
          swap_file="${RUNNER_TEMP}/fil-c.swap"
          fallocate --length 12G "${swap_file}"
          chmod 600 "${swap_file}"
          sudo mkswap "${swap_file}"
          sudo swapon "${swap_file}"
          free --human
          swapon --show

      - name: Cache Fil-C archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/filc-${{ env.FIL_C_VERSION }}-linux-x86_64.tar.xz
          key: fil-c-linux-x86_64-${{ env.FIL_C_VERSION }}-${{ env.FIL_C_SHA256 }}

      - name: Install Fil-C
        run: |
          archive="${RUNNER_TEMP}/filc-${FIL_C_VERSION}-linux-x86_64.tar.xz"
          fil_c_root="${RUNNER_TEMP}/filc-${FIL_C_VERSION}-linux-x86_64"

          if [ ! -f "${archive}" ]; then
            curl --fail --location --retry 3 \
              --output "${archive}" \
              "https://github.com/pizlonator/fil-c/releases/download/v${FIL_C_VERSION}/filc-${FIL_C_VERSION}-linux-x86_64.tar.xz"
          fi

          echo "${FIL_C_SHA256}  ${archive}" | sha256sum --check
          tar -xJf "${archive}" -C "${RUNNER_TEMP}"
          cd "${fil_c_root}"
          ./setup.sh

          echo "FIL_C_ROOT=${fil_c_root}" >> "${GITHUB_ENV}"
          echo "CC=${fil_c_root}/build/bin/clang" >> "${GITHUB_ENV}"
          echo "CXX=${fil_c_root}/build/bin/clang++" >> "${GITHUB_ENV}"

      - name: Fil-C version
        run: |
          "${CC}" --version
          "${CXX}" --version

      # Fil-C cannot safely link against libraries built by the host compiler.
      # Keep this job self-contained until zlib and Mbed TLS are built with Fil-C.
      - name: Configure AtomVM
        run: |
          cmake -S . -B build-fil-c -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_DISABLE_FIND_PACKAGE_MbedTLS=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE \
            -DLIBRT:FILEPATH="${FIL_C_ROOT}/pizfix/lib/librt.a" \
            -DAVM_WARNINGS_ARE_ERRORS=ON

      # The largest AtomVM translation units use several GiB while Fil-C compiles
      # them. Build serially and suppress DWARF data to stay within the runner's
      # memory limit. CCC_OVERRIDE_OPTIONS appends -g0 after AtomVM's target-level
      # -g option.
      - name: Build AtomVM
        env:
          CCC_OVERRIDE_OPTIONS: "+-g0"
        run: |
          (
            while true; do
              echo "Memory snapshot: $(date --iso-8601=seconds)"
              free --human
              ps -eo pid,ppid,rss,vsz,comm,args --sort=-rss | sed -n '1,8p'
              sleep 20
            done
          ) &
          memory_monitor_pid=$!

          stop_memory_monitor() {
            kill "${memory_monitor_pid}" 2>/dev/null || :
            wait "${memory_monitor_pid}" 2>/dev/null || :
          }
          trap stop_memory_monitor EXIT

          cmake --build build-fil-c --parallel 1 --target \
            AtomVM \
            atomvmlib \
            hello_world \
            test_alisp \
            test-enif \
            test_etest \
            test-heap \
            test-jit_stream_flash \
            test-mailbox \
            test-structs \
            test-term

      - name: Run C tests
        working-directory: build-fil-c
        run: |
          ./tests/test-enif
          ./tests/test-heap
          ./tests/test-jit_stream_flash
          ./tests/test-mailbox
          ./tests/test-structs
          ./tests/test-term

      - name: Run AtomVM smoke tests
        working-directory: build-fil-c
        run: |
          ./src/AtomVM ./examples/erlang/hello_world.avm ./libs/atomvmlib.avm
          ./src/AtomVM ./tests/libs/etest/test_etest.avm
          ./src/AtomVM ./tests/libs/alisp/test_alisp.avm
